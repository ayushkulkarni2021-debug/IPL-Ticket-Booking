
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>

    <nav class="navbar">
        <div class="nav-brand">
            <h2>IPL 2026</h2>
        </div>

        <button type="button" class="menu-toggle" id="menuToggle" aria-label="Toggle navigation" aria-expanded="false">
            &#9776;
        </button>

        <div class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="index.html#matches">Matches</a>
            <a href="booking.html">Book Ticket</a>
        </div>
    </nav>

    <section>
        <h2>Ticket Booking Form</h2>

        <form action="#" method="get"
              class="booking-form" id="bookingForm">

            <label>Name:</label>
            <input type="text" name="name"
                   placeholder="Enter your name"
                   minlength="3" maxlength="30" required>

            <br><br>

            <label>Email:</label>
            <input type="email" name="email"
                   placeholder="Enter your email" required>

            <br><br>

            <label>Phone Number:</label>
            <input type="tel" name="phone"
                   placeholder="Enter 10 digit number"
                   pattern="[0-9]{10}"
                   minlength="10" maxlength="10" required>

            <br><br>

            <label>Select Match:</label>
            <select name="match" id="match" required>
                <option value="">Choose Match</option>
                <option value="CSK vs MI">CSK vs MI</option>
                <option value="RCB vs KKR">RCB vs KKR</option>
                <option value="RR vs SRH">RR vs SRH</option>
                <option value="MI vs RCB">MI vs RCB</option>
            </select>

            <br><br>

            <label>Stand Category:</label>
            <select name="stand" id="stand" required>
                <option value="">Choose Stand</option>
                <option value="General">General</option>
                <option value="Premium">Premium</option>
                <option value="VIP">VIP</option>
            </select>

            <br><br>

            <label>Number of Tickets:</label>
            <input type="number" name="tickets"
                   id="quantity"
                   min="1" max="10" value="1" required>

            <br><br>

            <label>Additional Preference:</label>
            <br>

            <input type="radio" name="preference" value="Normal">
            Normal Seating

            <input type="radio" name="preference" value="Near Ground">
            Near Ground

            <br><br>

            <button type="submit" class="btn">Submit</button>
            <button type="reset" class="btn">Reset</button>

        </form>
    </section>

    <!-- Booking Summary Card -->
    <section class="summary-card">

        <h2>Booking Summary</h2>

        <p>Match:
            <span id="summaryMatch">Not selected</span>
        </p>

        <p>Stand:
            <span id="summaryStand">Not selected</span>
        </p>

        <p>Quantity:
            <span id="summaryQuantity">0</span>
        </p>

        <p>Price per Ticket:
            <span>₹<span id="summaryPrice">0</span></span>
        </p>

        <h3>Total Price: ₹
            <span id="totalPrice">0</span>
        </h3>

    </section>

    <footer>
        <p>Copyright © 2026 IPL Ticket Booking</p>
    </footer>

</body>
</html>
